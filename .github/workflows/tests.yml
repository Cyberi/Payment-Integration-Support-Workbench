name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: Verify generated Postman collection is up to date
        run: |
          python -m postman.build_collection
          git diff --exit-code -- postman/payment-integration-support.postman_collection.json
